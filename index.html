<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leela's Homemade Kitchen | Homemade Kerala snacks, spices and podis</title>
<meta name="description" content="Small-batch Kerala banana chips, sharkkaravaratti, chakka chips, chammanthi podi and spices, made by grandma. Order on WhatsApp.">
<meta name="theme-color" content="#0D0D0D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&family=Noto+Serif+Malayalam:wght@500&family=Noto+Sans+Malayalam:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0D0D0D;--card:#171717;--gold:#C9A24B;--tx:#F3EBDD;--tx2:#A89F91;--old:#6F685E;--em:#0F3B2E;--wa:#25D366;--r:10px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:400 17px/1.65 Jost,Inter,sans-serif;-webkit-text-size-adjust:100%}
body.ml{font-family:Jost,'Noto Sans Malayalam',sans-serif}
h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:500;line-height:1.15;color:var(--tx)}
.ml h1,.ml h2,.ml h3{font-family:'Noto Serif Malayalam',serif;line-height:1.4}
h1{font-size:clamp(2.4rem,9vw,4.4rem)}h2{font-size:clamp(1.9rem,6vw,2.7rem);margin-bottom:.6rem}h3{font-size:1.4rem}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{max-width:1080px;margin:auto;padding:0 20px}
section{padding:64px 0}
.sub{color:var(--tx2)}
.gold{color:var(--gold)}
.line{height:1px;background:var(--gold);opacity:.5;width:64px;margin:14px 0 22px}
.btn{display:inline-block;min-height:48px;padding:12px 26px;border-radius:var(--r);border:1px solid var(--gold);background:var(--gold);color:#0D0D0D;font:500 1rem Jost,sans-serif;cursor:pointer;transition:.3s;text-align:center}
.btn.o{background:transparent;color:var(--gold)}
.btn:hover{background:transparent;color:var(--gold)}.btn.o:hover{background:var(--gold);color:#0D0D0D}
.btn.wa{background:transparent;border-color:var(--wa);color:var(--wa)}.btn.wa:hover{background:var(--wa);color:#0D0D0D}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
header{position:sticky;top:0;z-index:20;background:rgba(13,13,13,.96);border-bottom:1px solid rgba(201,162,75,.3)}
.bar{display:flex;align-items:center;justify-content:space-between;height:64px;gap:10px}
.logo{font:600 1.35rem 'Cormorant Garamond',serif;color:var(--gold)}
nav{display:flex;gap:22px}
nav a{color:var(--tx2);transition:.3s}nav a:hover,nav a.on{color:var(--gold)}
.tools{display:flex;gap:10px;align-items:center}
.ib{background:none;border:1px solid rgba(201,162,75,.4);color:var(--gold);border-radius:var(--r);min-width:44px;height:44px;cursor:pointer;font:500 .95rem Jost,sans-serif;padding:0 10px}
.cnt{color:var(--tx)}
#menu{display:none}
@media(max-width:820px){nav{display:none;position:absolute;top:64px;left:0;right:0;background:var(--bg);flex-direction:column;padding:18px 20px;gap:16px;border-bottom:1px solid var(--gold)}nav.open{display:flex}#menu{display:block}}
.hero{min-height:88vh;display:flex;align-items:flex-end;padding:0;background:#000 center 25%/cover;position:relative}
.hero:before{content:"";position:absolute;inset:0;background:rgba(13,13,13,.62)}
.hero .wrap{position:relative;padding-bottom:72px;padding-top:90px}
.hero p{max-width:34ch;margin:18px 0 28px;color:var(--tx2);font-size:1.15rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px;margin-top:28px}
.card{background:var(--card);border:1px solid transparent;border-radius:var(--r);padding:14px;transition:.3s;display:block;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.card:hover{border-color:var(--gold)}
.card img{aspect-ratio:1;width:100%;object-fit:cover;border-radius:8px;background:#111}
.card h3{margin:14px 0 4px}
.price{font-size:1.05rem}.price s{color:var(--old);margin-left:8px}.price b{color:var(--gold);font-weight:500}
.ask{color:var(--tx2);font-size:.95rem}
.two{display:grid;gap:36px;grid-template-columns:1fr 1fr;align-items:center}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.em{background:var(--em)}
.ph{aspect-ratio:4/5;object-fit:cover;width:100%;border-radius:12px;background:#171717}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:24px}
.cats a{border:1px solid rgba(201,162,75,.4);border-radius:var(--r);padding:28px 20px;font:500 1.5rem 'Cormorant Garamond',serif;text-align:center;transition:.3s}
.ml .cats a{font-family:'Noto Serif Malayalam',serif;font-size:1.2rem}
.cats a:hover{background:var(--card);border-color:var(--gold)}
.vid{aspect-ratio:16/9;width:100%;border:0;border-radius:var(--r);background:var(--card)}
.vcard{background:var(--card);border-radius:var(--r);padding:12px}
.vcard p{margin:10px 4px 2px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.chip{min-height:44px;padding:8px 18px;border-radius:30px;border:1px solid rgba(201,162,75,.5);background:none;color:var(--tx2);font:400 1rem Jost,sans-serif;cursor:pointer}
.chip.on{border-color:var(--gold);color:var(--gold)}
input,select,textarea{width:100%;min-height:48px;background:var(--card);color:var(--tx);border:1px solid rgba(201,162,75,.35);border-radius:var(--r);padding:10px 14px;font:400 1rem Jost,'Noto Sans Malayalam',sans-serif}
textarea{min-height:80px}
label{display:block;margin:14px 0 6px;color:var(--tx2)}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}
.item{display:grid;grid-template-columns:84px 1fr;gap:14px;background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:14px}
.item img{width:84px;height:84px;object-fit:cover;border-radius:8px}
.err{color:#E0A08A;font-size:.95rem;margin-top:4px}
.fab{position:fixed;right:16px;bottom:16px;z-index:30;width:52px;height:52px;border-radius:50%;background:var(--bg);border:1px solid var(--wa);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.6)}
details{background:var(--card);border-radius:var(--r);padding:16px 18px;margin-bottom:12px}
summary{cursor:pointer;color:var(--gold);font-weight:500}
footer{border-top:1px solid rgba(201,162,75,.3);padding:40px 0 90px;color:var(--tx2)}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px 40px;justify-content:space-between}
.fade{animation:f 1s ease both}@keyframes f{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  if(!cart.length)return `<section><div class="wrap"><h2>${t("cart")}</h2><p class="sub">${t("empty")}</p><br><a class="btn" href="#/shop">${t("shop")}</a></div></section>`;
  const items=cart.map((i,n)=>{const p=find(i.id);return `<div class="item"><img src="${img(p)}" alt=""><div><h3>${pn(p)}</h3><p class="sub">${p.priceType==="fixed"?fmt(p.price)+" "+t("per"):t("pconf")}</p>
  <div class="row" style="margin-top:8px"><select data-q="${n}" aria-label="${t("qty")}">${[0.5,1,2,5].map(q=>`<option value="${q}" ${q==i.qty?"selected":""}>${qtxt(q)}</option>`).join("")}</select><button class="btn o" data-rm="${n}">${t("rem")}</button></div>
  <input data-c="${n}" value="${i.custom||""}" placeholder="${t("cph")}" aria-label="${t("custom")}" style="margin-top:8px">${i.custom&&p.priceType==="fixed"?`<p class="sub" style="font-size:.9rem">${t("fin")}</p>`:""}</div></div>`}).join("");
  return `<section><div class="wrap" style="max-width:720px"><h2>${t("cart")}</h2>${items}<label for="notes">${t("notes")}</label><textarea id="notes"></textarea>
  <h3 style="margin:22px 0" id="tot">${totalTxt()}</h3>
  <h3>Checkout</h3>
  ${[["nm",t("name"),"text","name"],["ad",t("addr"),"text","street-address"],["pc",t("pin"),"tel","postal-code"],["ph",t("phone"),"tel","tel"]].map(f=>`<label for="${f[0]}">${f[1]}</label><input id="${f[0]}" type="${f[2]}" autocomplete="${f[3]}" ${f[0]=="pc"?'maxlength="6" inputmode="numeric"':f[0]=="ph"?'maxlength="10" inputmode="numeric"':""}><div class="err" id="e${f[0]}"></div>`).join("")}
  <br><button class="btn wa" id="place" style="width:100%">${t("ord")}</button></div></section>`;
}
function story(){return `<section><div class="wrap two"><div><h1 style="font-size:clamp(2rem,7vw,3.2rem)">${t("story")}</h1><div class="line"></div><p class="sub">${t("st1")}</p></div><img class="ph" src="${CONFIG.storyImage||CONFIG.heroImage||ph("Grandma Leela")}" alt="Grandma Leela"></div></section>
<section class="em"><div class="wrap" style="max-width:720px"><h2>${t("st2")}</h2><p>${t("st3")}</p><br><h2>${t("st4")}</h2><p>${t("st5")}</p></div></section>`}
function videos(){return `<section><div class="wrap"><h2>${t("videos")}</h2><a class="btn" href="${CONFIG.channel}?sub_confirmation=1" target="_blank" rel="noopener">${t("sub")}</a><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">${CONFIG.videos.map(vid).join("")}</div></div></section>`}
function contact(){return `<section><div class="wrap" style="max-width:720px"><h2>${t("contact")}</h2><div class="row"><a class="btn wa" href="https://wa.me/${CONFIG.wa}" target="_blank" rel="noopener">WhatsApp</a><a class="btn o" href="tel:+${CONFIG.wa}">${t("call")} +91 96565 99691</a></div><br><h3>${t("fa")}</h3><p class="sub">${t("da")}</p><br><h3>${t("fq")}</h3><br>${[1,2,3,4].map(n=>`<details><summary>${t("q"+n)}</summary><p class="sub">${t("a"+n)}</p></details>`).join("")}</div></section>`}
function thanks(){return `<section><div class="wrap" style="text-align:center;padding:60px 20px"><h2>${t("thanks")}</h2><br><a class="btn" href="#/shop">${t("back")}</a></div></section>`}

function route(){
  const [,pg,arg]=location.hash.split("/");
  const v={"":home,shop:()=>shop(arg),p:()=>product(arg),story,videos,contact,cart:cartPage,thanks}[pg||""]||home;
  $("#app").innerHTML=v();$("#nav").classList.remove("open");window.scrollTo(0,0);chrome();bind(pg,arg);
}
function bind(pg,arg){
  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{shopState.cat=b.dataset.cat;route()});
  const q=$("#q");if(q){q.oninput=()=>{shopState.q=q.value;const pos=q.selectionStart;route();const n=$("#q");n.focus();n.setSelectionRange(pos,pos)}};
  const so=$("#sort");if(so)so.onchange=()=>{shopState.sort=so.value;route()};
  if(pg==="p"){const p=find(arg);if(!p)return;
    const upd=()=>{const qv=+$("#pq").value;$("#ordb").href=waLink(p.priceType==="fixed"?`Hello, I would like to order:\n${pn(p)} - ${qtxt(qv)}`:`Hello, please tell me today's price for ${p.name}`)};
    $("#pq").onchange=upd;upd();
    $("#addb").onclick=()=>{const qv=+$("#pq").value,ex=cart.find(i=>i.id===p.id&&!i.custom);ex?ex.qty=qv:cart.push({id:p.id,qty:qv,custom:""});save();$("#msg").textContent=t("added");chrome()};}
  if(pg==="cart"){
    document.querySelectorAll("[data-q]").forEach(s=>s.onchange=()=>{cart[s.dataset.q].qty=+s.value;save();$("#tot").textContent=totalTxt()});
    document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{cart.splice(b.dataset.rm,1);save();route()});
    document.querySelectorAll("[data-c]").forEach(i=>i.onchange=()=>{cart[i.dataset.c].custom=i.value.trim();save();const nt=$("#notes")?.value,f=["nm","ad","pc","ph"].map(x=>$("#"+x).value);route();$("#notes").value=nt;["nm","ad","pc","ph"].forEach((x,k)=>$("#"+x).value=f[k])});
    $("#place")&&($("#place").onclick=place);}
}
function place(){
  const v=x=>$("#"+x).value.trim();let ok=true;
  const chk=(id,good,msg)=>{$("#e"+id).textContent=good?"":msg;if(!good)ok=false};
  chk("nm",v("nm"),t("req"));chk("ad",v("ad"),t("req"));chk("pc",/^\d{6}$/.test(v("pc")),t("bad6"));chk("ph",/^\d{10}$/.test(v("ph")),t("bad10"));
  if(!ok)return;
  const lines=cart.map((i,n)=>{const p=find(i.id),q=i.custom?"Custom: "+i.custom:qtxt(i.qty);return `${n+1}. ${p.name} - ${q}${p.priceType!=="fixed"?" (price to be confirmed)":i.custom?" (final price to be confirmed)":""}`}).join("\n");
  const x=totals();
  const msg=`Hello, I would like to place an order.\n\nItems:\n${lines}\nEstimated total: ${fmt(x.sum)}${x.sp?" + spices":""} (final amount will be confirmed on WhatsApp)\n\nName: ${v("nm")}\nAddress: ${v("ad")}\nPincode: ${v("pc")}\nPhone: ${v("ph")}\nNotes: ${v("notes")||"-"}`;
  window.open(waLink(msg),"_blank");cart=[];save();location.hash="#/thanks";
}
$("#lang").onclick=()=>{lang=lang==="en"?"ml":"en";try{localStorage.setItem("lk_lang",lang)}catch(e){}route()};
$("#menu").onclick=()=>$("#nav").classList.toggle("open");
addEventListener("hashchange",route);route();
/* Home-screen shortcut support */
try{const m={name:"Leela's Homemade Kitchen",short_name:"Leela's",start_url:location.href.split("#")[0],display:"standalone",background_color:"#0D0D0D",theme_color:"#0D0D0D",icons:[{src:ph("L"),sizes:"any",type:"image/svg+xml"}]};
const l=document.createElement("link");l.rel="manifest";l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/manifest+json"}));document.head.appendChild(l)}catch(e){}
</script>
</body>
</html>
